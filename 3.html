<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Hello my name is Prateek</h1>
    <div id="alpha">
        <p>my new information</p>
    </div>
    <button onclick="add()">click to change</button>
    <script>
        function add() {
            let key = document.getElementById("alpha");
            key.innerHTML =
                "<h2>This is the new <u>information </u> of mine </h2> <p>now my name is prateek</p>";
        }
    </script>

</body>

</html>

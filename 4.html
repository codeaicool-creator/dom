<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .vip {
            color: aqua;
            background-color: burlywood;
            padding: 10px;
        }
    </style>
</head>

<body>
    <h2 id="mark">welcome to college</h2>
    <button onclick="change()">single button</button>
    <script>
        document.title = "change css";

        function change() {
            let flag = document.getElementById("mark")
            flag.classList.toggle("vip")
        }
    </script>

</body>

</html>
